apiVersion: v1
kind: Pod
metadata:
  name: deklarativ-webb
  labels:
    # TODO: Lägg till en label, t.ex. "app: min-webb" och "miljo: dev"
    # Format:
    # key: value
    app: min-webb
    environment: dev
spec:
  containers:
    - name: webb-container
      # TODO: Ange image (använd t.ex. "nginx:alpine")
      image: nginx:alpine
      ports:
        # TODO: Ange containerPort som Nginx lyssnar på (standard: 80)
        - containerPort: 80
