apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webb-ingress
spec:
  ingressClassName: nginx
  rules:
    # TODO 1: Ange den domän du vill lyssna på (t.ex. "min-app.local")
    - host: min-app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # TODO 2: Ange namnet på din tidigare Service (webb-service)
                name: webb-service
                port:
                  # TODO 3: Porten som Servicen lyssnar på (80)
                  number: 80
