apiVersion: apps/v1
kind: Deployment
metadata:
  name: lia-python-app
  namespace: default
  labels:
    app: lia-python-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lia-python-app
  template:
    metadata:
      labels:
        app: lia-python-app
    spec:
      # TODO 1: Knyt podden till vårt ServiceAccount (lia-sa)
      serviceAccountName: lia-sa
      imagePullSecrets:
        - name: acr-secret

      containers:
        - name: python-app
          # TODO 2: Ange sökvägen till din ACR-image med taggen :latest
          image: acrliaak01.azurecr.io/lia-python:latest
          imagePullPolicy: Always

          ports:
            # TODO 3: Porten som FastAPI/Uvicorn körs på i containern (8000)
            - containerPort: 8000

          # Hälsokontroller (Probes)
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
