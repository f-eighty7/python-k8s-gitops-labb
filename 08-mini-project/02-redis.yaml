apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: labb-projekt
spec:
  accessModes:
    # TODO 1: Vilket accessMode för en databas på en disk? (ReadWriteOnce)
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: labb-projekt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          # TODO 2: Image för Redis (t.ex. "redis:alpine")
          image: redis:alpine
          # Startkommando som tvingar Redis att kräva lösenord:
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  # TODO 3: Namnet på din Secret (redis-secret)
                  name: redis-secret
                  key: REDIS_PASSWORD
          ports:
            # TODO 4: Standardporten för Redis (6379)
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              # Redis standardmapp för persistent lagring:
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            # TODO 5: Referera till din PVC ovan (redis-pvc)
            claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: labb-projekt
spec:
  selector:
    # TODO 6: Matcha poddens label (app: redis)
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
